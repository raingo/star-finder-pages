<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep space background -->
  <circle cx="256" cy="256" r="240" fill="url(#spaceGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Outer astrolabe coordinate ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="2, 6" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#fcd34d" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Cardinal tick marks -->
  <line x1="256" y1="46" x2="256" y2="66" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="446" x2="256" y2="466" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" />
  <line x1="46" y1="256" x2="66" y2="256" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" />
  <line x1="446" y1="256" x2="466" y2="256" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" />

  <!-- Big Dipper Asterism -->
  <g stroke="#93c5fd" stroke-width="2" stroke-opacity="0.7" stroke-linecap="round">
    <line x1="146" y1="196" x2="126" y2="146" />
    <line x1="126" y1="146" x2="176" y2="121" />
    <line x1="176" y1="121" x2="196" y2="171" />
    <line x1="196" y1="171" x2="146" y2="196" />
    <line x1="196" y1="171" x2="241" y2="186" />
    <line x1="241" y1="186" x2="281" y2="206" />
    <line x1="281" y1="206" x2="326" y2="226" />
  </g>
  <!-- Dipper stars -->
  <circle cx="146" cy="196" r="4.5" fill="#e0f2fe" filter="url(#glow)" />
  <circle cx="126" cy="146" r="4.5" fill="#e0f2fe" filter="url(#glow)" />
  <circle cx="176" cy="121" r="4.5" fill="#e0f2fe" filter="url(#glow)" />
  <circle cx="196" cy="171" r="4.5" fill="#e0f2fe" filter="url(#glow)" />
  <circle cx="241" cy="186" r="4" fill="#e0f2fe" />
  <circle cx="281" cy="206" r="4" fill="#e0f2fe" />
  <circle cx="326" cy="226" r="4.5" fill="#e0f2fe" filter="url(#glow)" />

  <!-- Targeting Reticle Ring & Crosshair (Green pulse) -->
  <circle cx="256" cy="256" r="85" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.75" stroke-dasharray="10, 8" />
  <line x1="256" y1="156" x2="256" y2="226" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  <line x1="256" y1="286" x2="256" y2="356" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  <line x1="156" y1="256" x2="226" y2="256" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  <line x1="286" y1="256" x2="356" y2="256" stroke="#10b981" stroke-width="2" stroke-linecap="round" />

  <!-- Central Star Radial Glow -->
  <circle cx="256" cy="256" r="45" fill="url(#coreGlow)" />

  <!-- Center Diamond Star Flare -->
  <path d="M 256,216 Q 256,256 216,256 Q 256,256 256,296 Q 256,256 296,256 Q 256,256 256,216 Z" fill="#ffffff" filter="url(#glow)" />
  <circle cx="256" cy="256" r="5" fill="#fde047" />
</svg>
